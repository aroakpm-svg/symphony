name: make-all

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install filesystem ACL inspection tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends acl
        working-directory: .

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Diagnose protected-path fixture ancestors
        shell: bash
        run: |
          set -eu
          current="$PWD"
          while true; do
            stat --format='%n uid=%u mode=%a type=%F' "$current"
            getfacl --absolute-names --numeric --omit-header "$current"
            parent="$(dirname "$current")"
            [ "$parent" = "$current" ] && break
            current="$parent"
          done

      - name: Verify make all
        run: make all
