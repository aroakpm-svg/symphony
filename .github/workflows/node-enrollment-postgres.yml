name: node-enrollment-postgres

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/fixtures/aro-169-supabase-managed-event-triggers.sql"
      - ".github/scripts/test-node-enrollment.sh"
      - ".github/workflows/node-enrollment-postgres.yml"
      - "elixir/bin/node-enrollment-postflight"
      - "elixir/bin/node-enrollment-postflight-service.py"
      - "elixir/bin/node-enrollment-postflight.sql"
      - "elixir/priv/symphony_migrations/**"

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aro169_ci_root
          POSTGRES_PASSWORD: disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aro169_ci_root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify node enrollment lifecycle
        env:
          PGPASSWORD: disposable
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          TEST_ROOT_DATABASE_URL: postgresql://aro169_ci_root@localhost:5432/postgres
        run: bash .github/scripts/test-node-enrollment.sh

      - name: Verify full ARO-169 through ARO-166 migration lifecycle
        env:
          PGPASSWORD: disposable
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          migrations="$GITHUB_WORKSPACE/elixir/priv/symphony_migrations"
          psql_admin() { psql -X -q -v ON_ERROR_STOP=1 -d "$TEST_DATABASE_URL" "$@"; }
          contract_version() {
            psql_admin -A -t -c "select contract_version from symphony_staging.contract_versions where contract_name = '$1';"
          }
          apply_tail() {
            case "$(contract_version cross-machine-claims)" in
              '') psql_admin -f "$migrations/20260804000000_aro_164_cross_machine_claims.sql" ;;
              1) ;;
              *) echo "unexpected cross-machine-claims contract" >&2; return 1 ;;
            esac
            case "$(contract_version effect-ledger)" in
              '') psql_admin -f "$migrations/20260805000000_aro_165_effect_ledger.sql" ;;
              1) ;;
              *) echo "unexpected effect-ledger contract" >&2; return 1 ;;
            esac
            case "$(contract_version handoff-receipts)" in
              '') psql_admin -f "$migrations/20260806000000_aro_166_handoff_receipts.sql" ;;
              1|2) ;;
              *) echo "unexpected handoff-receipts contract" >&2; return 1 ;;
            esac
            case "$(contract_version handoff-receipts)" in
              1) PGOPTIONS="-c symphony.handoff_v1_writes_drained=on" \
                   psql_admin -f "$migrations/20260810000000_aro_166_handoff_retry_semantics.sql" ;;
              2) ;;
              *) echo "handoff V1 prerequisite missing" >&2; return 1 ;;
            esac
          }

          apply_tail
          apply_tail

          psql_admin -f "$migrations/20260810000000_aro_166_handoff_retry_semantics.down.sql"
          psql_admin -f "$migrations/20260806000000_aro_166_handoff_receipts.down.sql"
          psql_admin -f "$migrations/20260805000000_aro_165_effect_ledger.down.sql"
          psql_admin -f "$migrations/20260804000000_aro_164_cross_machine_claims.down.sql"

          apply_tail

          test "$(psql_admin -A -t -c "select contract_version from symphony_staging.contract_versions where contract_name = 'node-identity-routing-foundation';")" = "3"
          test "$(psql_admin -A -t -c "select contract_version from symphony_staging.contract_versions where contract_name = 'cross-machine-claims';")" = "1"
          test "$(psql_admin -A -t -c "select contract_version from symphony_staging.contract_versions where contract_name = 'effect-ledger';")" = "1"
          test "$(psql_admin -A -t -c "select contract_version from symphony_staging.contract_versions where contract_name = 'handoff-receipts';")" = "2"
          test "$(psql_admin -A -t -c "select to_regclass('symphony_staging.issue_claims') is not null;")" = "t"
          test "$(psql_admin -A -t -c "select to_regclass('symphony_staging.effect_operations') is not null;")" = "t"
          test "$(psql_admin -A -t -c "select to_regclass('symphony_staging.handoff_receipts') is not null;")" = "t"
          echo "ARO-169 through ARO-166 apply, reapply, rollback, and reapply lifecycle passed"
